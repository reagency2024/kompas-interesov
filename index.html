<style>
/* Layout: one narrow app column; home lists tests grouped by role, quiz and result screens swap in place. */
:root {
  --bg: #EEF2F1;
  --surface: #FFFFFF;
  --ink: #18222A;
  --muted: #5A6872;
  --line: #D5DEDC;
  --accent: #0E6B63;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECE8;
  --risk: #B4443A;
  --R: #B85A2E; --I: #2B66AA; --A: #8E46A6; --S: #24855C; --E: #B7820F; --C: #55657A;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A1E; --surface: #19242A; --ink: #E7EEEC; --muted: #9AABB0; --line: #2B3A40;
    --accent: #43B3A6; --accent-ink: #0B1513; --accent-soft: #1D3A37; --risk: #E37B70;
    --R: #E28A5E; --I: #6FA3E3; --A: #C185DA; --S: #5CC293; --E: #E2B54C; --C: #98A8BC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A1E; --surface: #19242A; --ink: #E7EEEC; --muted: #9AABB0; --line: #2B3A40;
  --accent: #43B3A6; --accent-ink: #0B1513; --accent-soft: #1D3A37; --risk: #E37B70;
  --R: #E28A5E; --I: #6FA3E3; --A: #C185DA; --S: #5CC293; --E: #E2B54C; --C: #98A8BC;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(26px, 7vw, 34px); font-weight: 700; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 500; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 16px/1.25 var(--font-body); padding: 14px 18px; border-radius: 12px; cursor: pointer;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:active { transform: scale(.98); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.small { font-size: 14px; padding: 10px 14px; }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 150px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
input[type=text] {
  font: 16px var(--font-body); padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}

/* home */
.group { display: flex; flex-direction: column; gap: 10px; }
.test { gap: 10px; }
.test .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.orig { color: var(--accent); border-color: var(--accent); }
.status { font-size: 14px; color: var(--muted); }
.status b { color: var(--ink); }
.status.done { color: var(--accent); }

/* hexagon */
.hex { width: 100%; max-width: 360px; margin: 0 auto; display: block; }
.hex text { font-family: var(--font-display); font-size: 13px; font-weight: 700; }
.hex .lbl { font-family: var(--font-body); font-size: 11px; font-weight: 500; fill: var(--muted); }

/* question */
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.qtext { font-family: var(--font-display); font-weight: 500; font-size: clamp(20px, 5.4vw, 25px); line-height: 1.3; min-height: 3.9em; display: flex; align-items: center; text-wrap: balance; }
.qtext.sm { font-size: clamp(17px, 4.6vw, 21px); min-height: 0; }
.prompt { font-size: 14px; color: var(--muted); }
.answers { display: flex; flex-direction: column; gap: 8px; }
.ans { display: flex; align-items: center; gap: 14px; text-align: left; }
.ans .dots { display: flex; gap: 3px; flex: none; width: 54px; }
.ans .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.ans .dots i.on { background: var(--accent); }
.ans[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.kbd { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
@media (hover: none) { .kbd { display: none; } }
.bip { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.bip div { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 17px; font-weight: 500; }
.bip b { font-family: var(--font-display); color: var(--accent); flex: none; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opts .btn { text-align: left; }
.opts.shapes .btn { display: grid; place-items: center; padding: 10px; }
.shape { width: 84px; height: 84px; display: block; }
.shape rect { fill: var(--ink); }
.sample { display: grid; place-items: center; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.sample .shape rect { fill: var(--accent); }

/* results */
.code { display: flex; gap: 8px; flex-wrap: wrap; }
.code span { font-family: var(--font-display); font-weight: 700; font-size: 28px; min-width: 52px; height: 52px; padding: 0 8px; display: grid; place-items: center; border-radius: 12px; color: var(--surface); background: var(--accent); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar .track i { display: block; height: 100%; border-radius: 99px; }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.axis { display: flex; flex-direction: column; gap: 6px; }
.axis .ends { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.axis .ends b { font-family: var(--font-display); }
.axis .line { position: relative; height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; }
.axis .line::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.axis .line i { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.card { border-top: 4px solid var(--c, var(--accent)); }
.card .tag { color: var(--c, var(--accent)); font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 14px; padding: 4px 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
.lvl { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.lvl.hi { color: var(--accent); border-color: var(--accent); }
.lvl.risk { color: var(--risk); border-color: var(--risk); }
dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
dt { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
dd { margin: 4px 0 0; }
ul.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
details summary { cursor: pointer; font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 5; }
textarea.copyfallback { width: 100%; min-height: 180px; font: 13px/1.4 var(--font-body); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
@media (max-width: 420px) { .bar { grid-template-columns: minmax(0, 118px) minmax(0, 1fr) 46px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <section id="home" class="wrap"></section>

      if (s && s.t) return s;
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
      if (old && Array.isArray(old.answers)) return { name: old.name || "", t: { onet: { a: old.answers, i: old.idx || 0 } } };
    } catch (e) {}
    return null;
  }
  function st(id) {
    const n = BYID[id].items.length;
    let s = state.t[id];
    if (!s || !Array.isArray(s.a) || s.a.length !== n) s = state.t[id] = { a: Array(n).fill(null), i: 0 };
    return s;
  }
  const answered = id => st(id).a.filter(v => v != null).length;
  const isDone = id => answered(id) === BYID[id].items.length;

  function show(id) { ["home", "quiz", "result"].forEach(s => { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }
  function toast(msg) {
    const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; d.setAttribute("role", "status");
    document.body.appendChild(d); setTimeout(() => d.remove(), 1800);
  }
  function copy(txt, fallbackEl) {
    const fb = () => { fallbackEl.value = txt; fallbackEl.hidden = false; fallbackEl.focus(); fallbackEl.select(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Скопировано"), fb);
    else fb();
  }
  const resultText = t => `${t.title} (${t.covers})\n${t.text(t.compute(st(t.id).a))}`;

  // ---------- home ----------
  // Logo: Holland hexagon with the six RIASEC colours and a compass needle (same drawing as icon.svg).
  const LOGO = `<svg viewBox="0 0 1024 1024" width="56" height="56" role="img" aria-label="Логотип Компас интересов" style="flex:none;border-radius:13px"><rect width="1024" height="1024" fill="#0E6B63"/><polygon points="512,182 797.8,347 797.8,677 512,842 226.2,677 226.2,347" fill="none" stroke="#E6F3F0" stroke-opacity=".9" stroke-width="30" stroke-linejoin="round"/>${[[512, 182, "#F09A6C"], [797.8, 347, "#7DB0F0"], [797.8, 677, "#D19AE8"], [512, 842, "#7ADBA8"], [226.2, 677, "#F2C55C"], [226.2, 347, "#B9C6D6"]].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="54" fill="${c}"/>`).join("")}<g transform="translate(512 512) rotate(32)"><polygon points="0,-268 72,0 -72,0" fill="#FFFFFF"/><polygon points="0,268 72,0 -72,0" fill="#FFFFFF" fill-opacity=".38"/><circle r="40" fill="#0D6A61" stroke="#FFFFFF" stroke-width="18"/></g></svg>`;
  function renderHome() {
    const done = TESTS.filter(t => isDone(t.id));
    const who = state.name ? esc(state.name) : "";
    $("home").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <span class="eyebrow">${TESTS.length} тестов для профориентации выпускника</span>
        <div style="display:flex;align-items:center;gap:14px">${LOGO}<h1>Компас интересов</h1></div>
        <p class="muted">Интересы, способности, сильные стороны, личность, ценности и готовность к выбору. Каждый тест проходится отдельно, в любом порядке. Ответы сохраняются на этом устройстве.</p>
      </div>
      <div class="panel">
        <label class="field" for="nameInput">Как зовут участника (необязательно)
          <input type="text" id="nameInput" maxlength="40" placeholder="Например, Аня" autocomplete="off" value="${who}">
        </label>
        <p class="note">Начать лучше с профиля интересов RIASEC: он основной, остальные тесты уточняют картину.</p>
      </div>
      ${done.length ? `<div class="panel">
        <div class="top" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Сводка${who ? " · " + who : ""}</h2><span class="badge">пройдено ${done.length} из ${TESTS.length}</span></div>
        <dl>${done.map(t => `<div><dt>${t.title}</dt><dd>${t.brief(t.compute(st(t.id).a))}</dd></div>`).join("")}</dl>
        <button class="btn" type="button" id="copyAll">Скопировать все результаты</button>
        <textarea class="copyfallback" id="copyAllFb" readonly hidden></textarea>
      </div>` : ""}
      ${GROUPS.map(g => {
        const ts = TESTS.filter(t => t.group === g);
        if (!ts.length) return "";
        return `<div class="group"><span class="eyebrow">${g}</span>${ts.map(testCard).join("")}</div>`;
      }).join("")}
      <p class="note">Тесты не заменяют консультацию профориентолога и не ставят диагнозов. Платные методики (Strong, Morrisby, CliftonStrengths, Hogan, MBTI, Birkman, DAT, CDSE, SHL) защищены авторским правом, поэтому вместо них здесь открытые научные аналоги или версии, составленные по их моделям. Где написано «Оригинальная методика», используются опубликованные вопросы в переводе.</p>`;
    $("nameInput").addEventListener("input", e => { state.name = e.target.value.trim(); save(); });
    const ca = $("copyAll");
    if (ca) ca.addEventListener("click", () => {
      const head = `Компас интересов${state.name ? ": " + state.name : ""}`;
      copy([head, ...done.map(resultText)].join("\n\n"), $("copyAllFb"));
    });
  }

  function testCard(t) {
    const n = t.items.length, k = answered(t.id), done = k === n;
    const status = done ? `<p class="status done">Пройден: ${t.brief(t.compute(st(t.id).a))}</p>` : k ? `<p class="status">Отвечено <b>${k} из ${n}</b></p>` : "";
    const btns = done
      ? `<button class="btn primary small" data-act="result" data-id="${t.id}" type="button">Результат</button><button class="btn small" data-act="restart" data-id="${t.id}" type="button">Пройти заново</button>`
      : `<button class="btn primary small" data-act="${k ? "resume" : "start"}" data-id="${t.id}" type="button">${k ? "Продолжить" : "Начать"}</button>${k ? `<button class="btn small" data-act="restart" data-id="${t.id}" type="button">Сначала</button>` : ""}`;
    return `<div class="panel test">
      <div class="top"><h2>${t.title}</h2><span class="badge ${t.orig ? "orig" : ""}">${t.orig ? "Оригинальная методика" : "Открытый аналог"}</span></div>
      <p>${t.what}</p>
      <p class="note">${t.orig ? "Методика" : "Основа"}: ${t.method}.<br>${t.orig ? "Покрывает" : "Вместо"}: ${t.covers}.</p>
      <p class="note">${n} ${n % 10 === 1 && n % 100 !== 11 ? "вопрос" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? "вопроса" : "вопросов"} · около ${t.mins} мин</p>
      ${status}
      <div class="row">${btns}</div>
    </div>`;
  }

  $("home").addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "result") return openResult(id);
    if (act === "restart") state.t[id] = null;
    const s = st(id);
    if (act !== "resume") s.i = 0; else s.i = Math.max(0, s.a.indexOf(null));
    save(); cur = id; renderQuestion(); show("quiz");
  });

  // ---------- quiz ----------
  function renderQuestion() {
    const t = BYID[cur], s = st(cur), i = s.i, it = t.items[i], n = t.items.length;
    $("counter").textContent = `${i + 1} из ${n}`;
    $("bar").style.width = `${answered(cur) / n * 100}%`;
    $("prompt").textContent = `${t.title} · ${t.prompt}`;
    const pressed = v => `aria-pressed="${s.a[i] === v}"`;
    let h = "";
    if (t.kind === "likert") {
      h = `<div class="qtext">${esc(it.text)}</div><div class="answers" role="group" aria-label="Варианты ответа">` +
        [4, 3, 2, 1, 0].map(v => `<button type="button" class="btn ans" data-v="${v}" ${pressed(v)}><span class="dots" aria-hidden="true">${[0, 1, 2, 3, 4].map(d => `<i class="${d <= v ? "on" : ""}"></i>`).join("")}</span><span>${t.scale[v]}</span><span class="kbd">${v + 1}</span></button>`).join("") + `</div>`;
    } else if (t.kind === "bipolar") {
      h = `<div class="bip"><div><b>А</b><span>${esc(it.a)}</span></div><div><b>Б</b><span>${esc(it.b)}</span></div></div><div class="answers" role="group" aria-label="Варианты ответа">` +
        [0, 1, 2, 3, 4].map(v => `<button type="button" class="btn ans" data-v="${v}" ${pressed(v)}><span>${t.scale[v]}</span><span class="kbd">${v + 1}</span></button>`).join("") + `</div>`;
    } else {
      h = `<div class="qtext sm">${it.qhtml}</div><div class="opts ${it.grid || ""}" role="group" aria-label="Варианты ответа">` +
        it.opts.map((o, v) => `<button type="button" class="btn" data-v="${v}" ${pressed(v)} aria-label="${it.grid ? "Вариант " + (v + 1) : esc(it.plain[v])}">${o}</button>`).join("") + `</div>`;
    }
    $("qbody").innerHTML = h;
  }

  $("qbody").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) answer(+b.dataset.v); });

  function answer(v) {
    if (locked) return;
    haptic();
    const t = BYID[cur], s = st(cur);
    s.a[s.i] = v; save();
    $("qbody").querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === v)));
    locked = true;
    setTimeout(() => {
      locked = false;
      const next = s.a.findIndex((x, k) => x == null && k > s.i);
      const first = s.a.indexOf(null);
      if (first === -1) { save(); openResult(cur); return; }
      s.i = next !== -1 ? next : first; save();
      renderQuestion();
    }, 180);
  }

  $("backBtn").addEventListener("click", () => {
    const s = st(cur);
    if (s.i === 0) { renderHome(); show("home"); return; }
    s.i--; save(); renderQuestion();
  });
  $("homeBtn").addEventListener("click", () => { renderHome(); show("home"); });

  document.addEventListener("keydown", e => {
    if ($("quiz").hidden || e.target.tagName === "INPUT") return;
    const t = BYID[cur], n = parseInt(e.key, 10), max = t.kind === "choice" ? t.items[st(cur).i].opts.length : 5;
    if (n >= 1 && n <= max) answer(n - 1);
    if (e.key === "Backspace" || e.key === "ArrowLeft") $("backBtn").click();
  });

  // ---------- result ----------
  function openResult(id) {
    cur = id;
    const t = BYID[id], r = t.compute(st(id).a);
    $("result").innerHTML = `
      <div class="qhead"><button class="btn ghost" type="button" id="resHome">← К тестам</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow">Результат${state.name ? " · " + esc(state.name) : ""}</span>
        <h1>${t.title}</h1>
        <p class="note">${t.method}</p>
      </div>
      ${t.view(r)}
      <div class="row">
        <button class="btn primary" id="resCopy" type="button">Скопировать результат</button>
        <button class="btn" id="resEdit" type="button">Изменить ответы</button>
      </div>
      <textarea class="copyfallback" id="resFb" readonly hidden></textarea>
      <button class="btn ghost" id="resRestart" type="button">Пройти заново</button>`;
    if (t.after) t.after(r);
    $("resHome").addEventListener("click", () => { renderHome(); show("home"); });
    $("resCopy").addEventListener("click", () => copy(`${state.name ? state.name + ": " : ""}${resultText(t)}`, $("resFb")));
    $("resEdit").addEventListener("click", () => { st(id).i = 0; save(); renderQuestion(); show("quiz"); });
    $("resRestart").addEventListener("click", () => { state.t[id] = null; st(id); save(); renderQuestion(); show("quiz"); });
    show("result");
  }

  const saved = load();
  if (saved) state = saved;
  renderHome();

})();
</script>
</body>
</html>
